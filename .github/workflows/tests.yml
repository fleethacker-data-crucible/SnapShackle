name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    # Windows jobs: every run step is Windows PowerShell 5.1 (org rule). The Linux job sets its own shell.
    shell: powershell
jobs:
  windows:
    timeout-minutes: 30
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Host tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NoLogo -ExecutionPolicy Bypass -File tests\host_tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE" }   # also catches a command that never ran
      - name: JavaScript syntax
        shell: powershell
        run: |
          if (-not (Get-Command node -ErrorAction SilentlyContinue)) { Write-Host 'node not installed; skipping'; exit 0 }
          Get-ChildItem assets\*.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE) { exit 1 } }
      - name: Loopback port fallback (real Windows sockets)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NoLogo -STA -ExecutionPolicy Bypass -File tests\windows_port_smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE" }   # also catches a command that never ran
      - name: Native capture benchmark
        # Needs an interactive desktop. A runner installed as a service has none, so this step may be skipped.
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NoLogo -STA -ExecutionPolicy Bypass -File tests\windows_capture_perf.ps1 -DesktopCapture
          if ($LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE" }   # also catches a command that never ran
  static:
    # Python static checks. Python is fine on the Linux runners (not on Windows runners).
    # The containers have python3 3.8 and no `python` alias, so call python3 from bash.
    runs-on: [self-hosted, linux, docker]
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Static checks
        run: |
          for script in tests/static_check.py tests/launcher_static_check.py; do
            python3 "$script" || { echo "::error title=$script::static check failed"; exit 1; }
          done
