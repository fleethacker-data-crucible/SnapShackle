name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    # Windows jobs: every run step is Windows PowerShell 5.1 (org rule). The Linux job sets its own shell.
    shell: powershell
jobs:
  windows:
    timeout-minutes: 30
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Host tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NoLogo -ExecutionPolicy Bypass -File tests\host_tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE" }   # also catches a command that never ran
      - name: JavaScript syntax
        shell: powershell
        run: |
          if (-not (Get-Command node -ErrorAction SilentlyContinue)) { Write-Host 'node not installed; skipping'; exit 0 }
          Get-ChildItem assets\*.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE) { exit 1 } }
          node tests/audio_test.js
          if ($LASTEXITCODE) { exit 1 }
          node tests/webcam_test.js
          if ($LASTEXITCODE) { exit 1 }
          node tests/voice_test.js
          node tests/aisuggest_test.js
          if ($LASTEXITCODE) { exit 1 }
      - name: Loopback port fallback (real Windows sockets)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NoLogo -STA -ExecutionPolicy Bypass -File tests\windows_port_smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE" }   # also catches a command that never ran
      - name: Windows OCR bridge (synthetic images)
        # Skips itself with a message where the runner has no OCR language pack.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NoLogo -STA -ExecutionPolicy Bypass -File tests\windows_ocr_test.ps1
          if ($LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE" }   # also catches a command that never ran
      - name: Fleet actions (Pester 5, Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $have = @(Get-Module -ListAvailable Pester | Where-Object { $_.Version.Major -eq 5 })
          if ($have.Count -eq 0) {
            Install-Module Pester -MinimumVersion 5.0.0 -MaximumVersion 5.99.99 -Force -Scope CurrentUser -SkipPublisherCheck
          }
          Import-Module Pester -MinimumVersion 5.0.0 -MaximumVersion 5.99.99
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NoLogo -ExecutionPolicy Bypass -Command "Import-Module Pester -MinimumVersion 5.0.0 -MaximumVersion 5.99.99; Invoke-Pester -Path tests\FleetAction.Tests.ps1 -CI"
          if ($LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE" }
      - name: CLI and API parity (offline)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NoLogo -ExecutionPolicy Bypass -File tests\commands_test.ps1
          if ($LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE" }   # also catches a command that never ran
      - name: CLI end to end (headless host, temporary data folder)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NoLogo -STA -ExecutionPolicy Bypass -File tests\cli_test.ps1
          if ($LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE" }   # also catches a command that never ran
      - name: Redaction patterns (no OCR)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NoLogo -ExecutionPolicy Bypass -File tests\redact_ps_test.ps1
          if ($LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE" }   # also catches a command that never ran
      - name: Evidence capture (synthetic windows, real OCR)
        # Draws its own windows (needs an interactive desktop); skips itself where OCR or a desktop is missing.
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NoLogo -STA -ExecutionPolicy Bypass -File tests\evidence_capture_test.ps1
          if ($LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE" }   # also catches a command that never ran
      - name: Share routes (real host, temporary data folder)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NoLogo -STA -ExecutionPolicy Bypass -File tests\share_api_test.ps1
          if ($LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE" }   # also catches a command that never ran
      - name: Hand-off helper (synthetic capture folder)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NoLogo -ExecutionPolicy Bypass -File tests\handoff_test.ps1
          if ($LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE" }
      - name: Own data folder (real host, temporary folders)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NoLogo -STA -ExecutionPolicy Bypass -File tests\data_dir_test.ps1
          if ($LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE" }   # also catches a command that never ran
      - name: AI help through a fake router (real host, temporary data folder)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NoLogo -STA -ExecutionPolicy Bypass -File tests\ai_router_test.ps1
          if ($LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE" }   # also catches a command that never ran
      - name: Capture format contract (real host, temporary data folder)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NoLogo -STA -ExecutionPolicy Bypass -File tests\capture_format_test.ps1
          if ($LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE" }   # also catches a command that never ran
      - name: Native capture benchmark
        # Needs an interactive desktop. A runner installed as a service has none, so this step may be skipped.
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NoLogo -STA -ExecutionPolicy Bypass -File tests\windows_capture_perf.ps1 -DesktopCapture
          if ($LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE" }   # also catches a command that never ran
  static:
    # Python static checks. Python is fine on the Linux runners (not on Windows runners).
    # The containers have python3 3.8 and no `python` alias, so call python3 from bash.
    runs-on: [self-hosted, linux, docker]
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Static checks
        run: |
          for script in tests/static_check.py tests/launcher_static_check.py; do
            python3 "$script" || { echo "::error title=$script::static check failed"; exit 1; }
          done
