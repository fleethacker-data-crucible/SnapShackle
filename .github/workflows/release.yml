name: Release zip
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: [self-hosted, Windows, win11]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build SnapShackle-<version>.zip (runtime files only)
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version"
          }
          $stage = Join-Path $env:RUNNER_TEMP "SnapShackle-$version"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory $stage | Out-Null
          # Runtime only: no tests, dev launcher, CI config or docs images. assets/brand holds the
          # README emblems; the app never loads them, so they stay out of the zip.
          # CutterMk.bat forwards to Launch-SnapShackle.bat, so shortcuts made before the rename (and a
          # zip unpacked over a CutterMk folder) start the new host instead of the old Start-CutterMk.ps1.
          foreach ($item in 'Launch-SnapShackle.bat','CutterMk.bat','Start-SnapShackle.ps1','Stop-SnapShackle.ps1','VERSION','index.html','README.md','assets','modules') {
            Copy-Item $item -Destination $stage -Recurse
          }
          $brand = Join-Path $stage 'assets\brand'
          if (Test-Path $brand) { Remove-Item $brand -Recurse -Force }
          $zip = Join-Path $env:RUNNER_TEMP "SnapShackle-$version.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          "ZIP=$zip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshackle-release
          path: ${{ env.ZIP }}
      - name: Attach to the GitHub release
        if: github.ref_type == 'tag'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release may already exist for this tag (made by hand or by "gh release create",
          # which also makes the tag). Upload to it instead of failing on "already exists".
          $ErrorActionPreference = 'Continue'  # gh writes "not found" to stderr; do not stop on it
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag exists; uploading $env:ZIP to it."
            gh release upload $tag $env:ZIP --clobber
          } else {
            gh release create $tag $env:ZIP --title "SnapShackle $tag" --generate-notes
          }
          exit $LASTEXITCODE
