<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SnipHero Studio</title>
<style>:root{font:14px Segoe UI,system-ui;background:#0c101a;color:#f1f3f8}*{box-sizing:border-box}body{margin:0}header,.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;background:#171e2b;border-bottom:1px solid #353e4c}header b{font-size:24px;color:#ff4356}button,select,input{background:#242e40;color:#fff;border:1px solid #465165;border-radius:7px;padding:8px;cursor:pointer}button:hover,.active{background:#793040;border-color:#ff4356}.layout{display:grid;grid-template-columns:205px minmax(0,1fr) 215px;height:calc(100vh - 118px)}aside{padding:15px;background:#161d2a;overflow:auto}main{padding:24px;overflow:auto;background:repeating-conic-gradient(#202735 0% 25%,#1b2230 0% 50%) 50%/24px 24px}canvas{background:white;box-shadow:0 12px 35px #0008;touch-action:none;cursor:crosshair}label{display:block;margin:14px 0 5px}input[type=range],input[type=color]{width:100%}#tools{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}#library button{display:block;width:100%;overflow:hidden;text-overflow:ellipsis;margin:4px 0}small,#status{color:#b0bacb}</style>
<header><b>✂ SNIP<span style="color:white">HERO</span></b><small>CAPTURE • ANNOTATE • SHARE</small><small style="margin-left:auto">● Local session</small></header>
<div class="bar"><button id="capture">📸 Capture all</button><select id="display"><option value="">All displays</option></select><button id="region">Capture region</button><button id="browser">Browser capture</button><button id="import">Open image</button><input id="file" type="file" accept="image/*" hidden><button id="undo">Undo</button><button id="redo">Redo</button><button id="copy">Copy</button><button id="png">PNG</button><button id="jpg">JPEG</button><button id="save">Save library</button><button id="refresh">Library</button><button id="projectSave">Save project</button><button id="projectOpen">Open project</button><input id="projectFile" type="file" accept=".json" hidden><button id="clear">New</button></div>
<div class="layout"><aside><b>Annotation tools</b><div id="tools"></div><label>Color</label><input id="color" type="color" value="#ff4054"><label>Stroke width</label><input id="width" type="range" min="1" max="32" value="4"><label>Text size</label><input id="font" type="range" min="12" max="90" value="28"><p><small>Drag to draw or redact. Paste images with Ctrl+V. Ctrl+Z / Ctrl+Y for history.</small></p></aside><main><canvas id="canvas" width="1280" height="720"></canvas></main><aside><b>Inspector</b><label>Zoom</label><input id="zoom" type="range" min="25" max="200" value="100"><span id="zoomLabel">100%</span><label>Capture library</label><div id="library"></div><label>Dimensions</label><div id="dims"></div><label>Status</label><p id="status">Ready</p><label>History</label><small id="history"></small></aside></div>
<script>
const TOKEN='__SESSION_TOKEN__',api=(u,o={})=>fetch(u,{...o,headers:{...o.headers,'X-SnipHero-Token':TOKEN}}),$=s=>document.querySelector(s),c=$('#canvas'),g=c.getContext('2d',{willReadFrequently:true});let tool='arrow',start=null,base=null,history=[],idx=-1,count=1;
function status(t){$('#status').textContent=t}function checkpoint(label){history=history.slice(0,idx+1);history.push({image:c.toDataURL(),label});if(history.length>30)history.shift();idx=history.length-1;$('#history').textContent=history.map((x,i)=>(i===idx?'● ':'○ ')+x.label).reverse().join(' · ');$('#dims').textContent=c.width+' × '+c.height}
function restore(n){if(n<0||n>=history.length)return;idx=n;let im=new Image;im.onload=()=>{c.width=im.width;c.height=im.height;g.drawImage(im,0,0);$('#dims').textContent=c.width+' × '+c.height};im.src=history[n].image;$('#history').textContent=history.map((x,i)=>(i===idx?'● ':'○ ')+x.label).reverse().join(' · ')}
g.fillStyle='white';g.fillRect(0,0,c.width,c.height);checkpoint('New canvas');
const names=['arrow','rectangle','ellipse','line','pen','highlight','text','number','blur','pixelate','redact','crop'];names.forEach(n=>{let b=document.createElement('button');b.textContent=n;b.id='tool-'+n;b.onclick=()=>select(n);$('#tools').append(b)});function select(n){tool=n;document.querySelectorAll('#tools button').forEach(b=>b.classList.toggle('active',b.id==='tool-'+n));status('Tool: '+n)}select('arrow');
function pos(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
function draw(a,b){let x=Math.min(a.x,b.x),y=Math.min(a.y,b.y),w=Math.abs(a.x-b.x),h=Math.abs(a.y-b.y),dx=b.x-a.x,dy=b.y-a.y;g.lineWidth=+$('#width').value;g.strokeStyle=$('#color').value;g.fillStyle=$('#color').value;g.lineCap='round';g.lineJoin='round';
if(tool==='pen'||tool==='highlight'){g.save();g.globalAlpha=tool==='highlight'?.3:1;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();g.restore();return}
if(tool==='rectangle'||tool==='crop'){g.save();if(tool==='crop')g.setLineDash([8,6]);g.strokeRect(x,y,w,h);g.restore()}
if(tool==='ellipse'){g.beginPath();g.ellipse(x+w/2,y+h/2,Math.max(1,w/2),Math.max(1,h/2),0,0,Math.PI*2);g.stroke()}
if(tool==='line'||tool==='arrow'){g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();if(tool==='arrow'){let ang=Math.atan2(dy,dx),len=Math.max(12,g.lineWidth*5);g.beginPath();g.moveTo(b.x,b.y);g.lineTo(b.x-len*Math.cos(ang-.5),b.y-len*Math.sin(ang-.5));g.lineTo(b.x-len*Math.cos(ang+.5),b.y-len*Math.sin(ang+.5));g.closePath();g.fill()}}
if(tool==='redact'){g.fillStyle='black';g.fillRect(x,y,w,h)}
if(tool==='pixelate'||tool==='blur'){let sx=Math.max(0,Math.floor(x)),sy=Math.max(0,Math.floor(y)),sw=Math.min(c.width-sx,Math.ceil(w)),sh=Math.min(c.height-sy,Math.ceil(h));if(sw<2||sh<2)return;let off=document.createElement('canvas');off.width=sw;off.height=sh;off.getContext('2d').drawImage(c,sx,sy,sw,sh,0,0,sw,sh);if(tool==='pixelate'){let tiny=document.createElement('canvas');tiny.width=Math.max(1,Math.floor(sw/14));tiny.height=Math.max(1,Math.floor(sh/14));tiny.getContext('2d').drawImage(off,0,0,tiny.width,tiny.height);g.imageSmoothingEnabled=false;g.drawImage(tiny,sx,sy,sw,sh);g.imageSmoothingEnabled=true}else{g.save();g.filter='blur(12px)';g.drawImage(off,sx,sy);g.restore()}}}
c.onpointerdown=e=>{let p=pos(e);if(tool==='text'){let t=prompt('Text:');if(t){g.fillStyle=$('#color').value;g.font='bold '+$('#font').value+'px Segoe UI';g.fillText(t,p.x,p.y);checkpoint('Text')}return}if(tool==='number'){g.fillStyle=$('#color').value;g.beginPath();g.arc(p.x,p.y,20,0,Math.PI*2);g.fill();g.fillStyle='white';g.textAlign='center';g.textBaseline='middle';g.font='bold 24px Segoe UI';g.fillText(count++,p.x,p.y);g.textAlign='start';g.textBaseline='alphabetic';checkpoint('Number');return}start=p;base=g.getImageData(0,0,c.width,c.height);c.setPointerCapture(e.pointerId)};
c.onpointermove=e=>{if(!start)return;let p=pos(e);if(tool==='pen'||tool==='highlight'){draw(start,p);start=p;return}g.putImageData(base,0,0);if(!['blur','pixelate','redact'].includes(tool))draw(start,p)};
c.onpointerup=e=>{if(!start)return;let p=pos(e),a=start;if(tool==='crop'){g.putImageData(base,0,0);let x=Math.max(0,Math.floor(Math.min(a.x,p.x))),y=Math.max(0,Math.floor(Math.min(a.y,p.y))),w=Math.min(c.width-x,Math.ceil(Math.abs(p.x-a.x))),h=Math.min(c.height-y,Math.ceil(Math.abs(p.y-a.y)));if(w>2&&h>2){let d=g.getImageData(x,y,w,h);c.width=w;c.height=h;g.putImageData(d,0,0)}}else if(tool!=='pen'&&tool!=='highlight'){g.putImageData(base,0,0);draw(a,p)}start=null;base=null;checkpoint(tool)};
$('#undo').onclick=()=>restore(idx-1);$('#redo').onclick=()=>restore(idx+1);document.onkeydown=e=>{if(e.ctrlKey&&e.key.toLowerCase()==='z'){e.preventDefault();restore(idx-1)}if(e.ctrlKey&&e.key.toLowerCase()==='y'){e.preventDefault();restore(idx+1)}};
function load(src){let im=new Image;im.onload=()=>{c.width=im.naturalWidth;c.height=im.naturalHeight;g.drawImage(im,0,0);checkpoint('Loaded image')};im.src=src}
$('#capture').onclick=async()=>{try{let s=$('#display').value,r=await api('/api/capture'+(s?'?screen='+s:''));if(!r.ok)throw Error('Capture failed');load(URL.createObjectURL(await r.blob()))}catch(e){status(e.message)}};
$('#region').onclick=async()=>{await $('#capture').onclick();select('crop');status('Drag to crop the captured desktop')};
$('#browser').onclick=async()=>{try{let stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});try{let v=document.createElement('video');v.srcObject=stream;await v.play();await new Promise(r=>setTimeout(r,200));let off=document.createElement('canvas');off.width=v.videoWidth;off.height=v.videoHeight;off.getContext('2d').drawImage(v,0,0);load(off.toDataURL())}finally{stream.getTracks().forEach(t=>t.stop())}}catch(e){status(e.message)}};
$('#import').onclick=()=>$('#file').click();$('#file').onchange=e=>{if(e.target.files[0])load(URL.createObjectURL(e.target.files[0]))};document.addEventListener('paste',e=>{for(let f of e.clipboardData.files)if(f.type.startsWith('image/'))load(URL.createObjectURL(f))});
function exportFile(type){let a=document.createElement('a');a.download='SnipHero-'+Date.now()+'.'+(type==='image/jpeg'?'jpg':'png');a.href=c.toDataURL(type,.93);a.click()}$('#png').onclick=()=>exportFile('image/png');$('#jpg').onclick=()=>exportFile('image/jpeg');
$('#copy').onclick=async()=>{try{let b=await new Promise(r=>c.toBlob(r));await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);status('Copied')}catch(e){status(e.message)}};
$('#zoom').oninput=e=>{let z=+e.target.value;$('#zoomLabel').textContent=z+'%';c.style.width=c.width*z/100+'px';c.style.height=c.height*z/100+'px'};
$('#clear').onclick=()=>{c.width=1280;c.height=720;g.fillStyle='white';g.fillRect(0,0,c.width,c.height);checkpoint('New canvas')};
async function refresh(){try{let r=await api('/api/library'),d=await r.json();$('#library').replaceChildren();for(let it of d.items||[]){let b=document.createElement('button');b.textContent=it.name;b.onclick=async()=>{let r=await api('/api/library/'+encodeURIComponent(it.name));if(r.ok)load(URL.createObjectURL(await r.blob()))};$('#library').append(b)}}catch(e){status(e.message)}}$('#refresh').onclick=refresh;
$('#save').onclick=async()=>{try{let b=await new Promise(r=>c.toBlob(r));let r=await api('/api/library',{method:'POST',body:b,headers:{'Content-Type':'image/png'}});if(!r.ok)throw Error('Save failed');status('Saved '+(await r.json()).name);refresh()}catch(e){status(e.message)}};
$('#projectSave').onclick=()=>{let b=new Blob([JSON.stringify({format:'SnipHero-project-v1',history,index:idx,step:count})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='SnipHero-project.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
$('#projectOpen').onclick=()=>$('#projectFile').click();$('#projectFile').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(d.format!=='SnipHero-project-v1'||!Array.isArray(d.history)||!d.history.length||d.history.length>30)throw Error('Invalid project');history=d.history;count=d.step||1;restore(Math.max(0,Math.min(d.index,history.length-1)))}catch(e){status(e.message)}};
api('/api/screens').then(r=>r.json()).then(d=>(d.screens||[]).forEach((s,i)=>{let o=document.createElement('option');o.value=i;o.textContent='Display '+(i+1)+(s.primary?' (primary)':'');$('#display').append(o)})).catch(()=>{});refresh();
</script></html>
